<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>SAP พังงา</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="แนวทางการใช้ยาปฏิชีวนะป้องกันการติดเชื้อในการผ่าตัด โรงพยาบาลพังงา พ.ศ. 2569 โดยคณะกรรมการ AMR">

<style>:root{color-scheme:light;} body{margin:0;} img{max-width:100%;} [hidden]{display:none!important;}</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink:#1b2a2e;
    --ink-soft:#4a5c60;
    --paper:#f6f4ee;
    --surface:#ffffff;
    --surface-2:#eef1ea;
    --line:#d9d3c2;
    --teal:#0e5652;
    --teal-deep:#0a3e3c;
    --teal-tint:#e2ede9;
    --amber:#b5652c;
    --amber-tint:#f7e9de;
    --red:#a1392a;
    --red-tint:#f6e2de;
    --chip-bg:#e7e2d2;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 6px 20px -8px rgba(20,30,28,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ink:#eef1ec;
      --ink-soft:#a9b6b2;
      --paper:#12181a;
      --surface:#1a2224;
      --surface-2:#20292b;
      --line:#2c3739;
      --teal:#5fb3aa;
      --teal-deep:#8ed0c7;
      --teal-tint:#182826;
      --amber:#e0a469;
      --amber-tint:#2a2119;
      --red:#e08d7c;
      --red-tint:#2c1e1b;
      --chip-bg:#26302f;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#eef1ec;
    --ink-soft:#a9b6b2;
    --paper:#12181a;
    --surface:#1a2224;
    --surface-2:#20292b;
    --line:#2c3739;
    --teal:#5fb3aa;
    --teal-deep:#8ed0c7;
    --teal-tint:#182826;
    --amber:#e0a469;
    --amber-tint:#2a2119;
    --red:#e08d7c;
    --red-tint:#2c1e1b;
    --chip-bg:#26302f;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun','IBM Plex Mono',sans-serif;
    font-size:16px;
    line-height:1.6;
    padding-inline:0;
  }
  h1,h2,h3,.disp{ font-family:'Noto Serif Thai','Sarabun',serif; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }

  a{ color:var(--teal-deep); }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 18px calc(14px);
  }
  .topbar-inner{ max-width:1040px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:10px; flex:1 1 auto; min-width:220px; }
  .brand .mark{
    width:34px; height:34px; border-radius:9px; background:var(--teal); color:#fbf9f2;
    display:flex; align-items:center; justify-content:center; font-family:'Noto Serif Thai',serif;
    font-weight:700; font-size:15px; flex:none;
  }
  .brand h1{ font-size:18px; margin:0; font-weight:700; color:var(--ink); }
  .brand .sub{ font-size:12.5px; color:var(--ink-soft); }

  nav.tabs{
    display:flex; gap:4px; overflow-x:auto; max-width:1040px; margin:12px auto 0; padding-bottom:2px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:none; border:none; background:transparent; color:var(--ink-soft);
    font-family:'Sarabun',sans-serif; font-size:14.5px; font-weight:600;
    padding:8px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{ background:var(--surface-2); color:var(--ink); }
  nav.tabs button[aria-selected="true"]{ background:var(--teal); color:#fbf9f2; }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--teal-deep); outline-offset:2px;
  }

  main{ max-width:1040px; margin:0 auto; padding:26px 18px 64px; }
  section.pane{ display:none; }
  section.pane.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }

  .lede{ color:var(--ink-soft); font-size:15px; max-width:64ch; margin:2px 0 22px; }
  h2.page-title{ font-size:25px; margin:0 0 4px; color:var(--teal-deep); }
  h3.block-title{ font-size:17px; margin:26px 0 10px; color:var(--ink); font-weight:700; }
  h3.block-title .eyebrow{ display:block; font-family:'Sarabun'; font-weight:700; font-size:12px; letter-spacing:.08em; color:var(--teal); margin-bottom:3px; }

  p{ margin:0 0 12px; }
  ul.plain{ margin:0 0 14px; padding-inline-start:20px; }
  ul.plain li{ margin-bottom:8px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; box-shadow:var(--shadow);
  }
  .card + .card{ margin-top:14px; }

  .cite{ font-size:12.5px; color:var(--ink-soft); }

  /* principle cards */
  .principles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin:16px 0 8px; }
  .principle{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .principle .num{
    font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; color:var(--teal);
    letter-spacing:.06em;
  }
  .principle h4{ margin:0; font-size:15.5px; font-family:'Noto Serif Thai'; color:var(--ink); }
  .principle p{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  /* search + lookup */
  .search-wrap{ position:relative; margin-bottom:14px; }
  .search-wrap input{
    width:100%; font-family:'Sarabun'; font-size:16px; padding:12px 14px 12px 40px;
    border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-soft); }
  .result-count{ font-size:12.5px; color:var(--ink-soft); margin:-6px 0 12px; }

  .proc-list{ display:flex; flex-direction:column; gap:10px; }
  .proc{
    border:1px solid var(--line); border-radius:13px; background:var(--surface); overflow:hidden;
  }
  .proc summary{
    list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:12px;
  }
  .proc summary::-webkit-details-marker{ display:none; }
  .proc summary .name{ font-weight:600; font-size:15px; flex:1 1 auto; }
  .proc summary .chev{ color:var(--ink-soft); transition:transform .18s; flex:none; }
  .proc[open] summary .chev{ transform:rotate(90deg); }
  .proc .body{ padding:0 16px 16px; border-top:1px solid var(--line); margin-top:2px; padding-top:12px; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; margin-bottom:4px;}
  .kv dt{ color:var(--ink-soft); font-size:12.5px; padding-top:2px; white-space:nowrap;}
  .kv dd{ margin:0; }
  .tag{
    display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; letter-spacing:.03em;
    padding:3px 9px; border-radius:999px; background:var(--chip-bg); color:var(--ink-soft);
  }

  /* generic table */
  .twrap{ overflow-x:auto; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
  table{ border-collapse:collapse; width:100%; min-width:560px; font-size:14px; }
  thead th{
    background:var(--teal); color:#fbf9f2; text-align:left; font-weight:700; padding:11px 14px;
    font-size:13px; position:sticky; top:0;
  }
  tbody td{ padding:11px 14px; border-top:1px solid var(--line); vertical-align:top; }
  tbody tr:nth-child(even){ background:var(--surface-2); }
  td.drug{ font-weight:600; white-space:nowrap; }
  td .mono-note{ font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--ink-soft); }

  .callout{
    display:flex; gap:11px; border-radius:12px; padding:13px 15px; font-size:13.5px; margin:14px 0;
    border:1px solid transparent;
  }
  .callout.amber{ background:var(--amber-tint); border-color:color-mix(in srgb, var(--amber) 35%, transparent); color:var(--ink); }
  .callout.red{ background:var(--red-tint); border-color:color-mix(in srgb, var(--red) 35%, transparent); color:var(--ink); }
  .callout svg{ flex:none; margin-top:1px; }
  .callout b{ display:block; margin-bottom:2px; }

  ol.steps{ margin:0; padding-inline-start:22px; display:flex; flex-direction:column; gap:10px; }
  ol.steps li{ padding-left:2px; }
  ol.steps b{ color:var(--teal-deep); }

  .bundle-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:14px; }
  .bundle-item{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px;
    font-size:13.5px; display:flex; gap:9px; align-items:flex-start;
  }
  .bundle-item .n{ font-family:'IBM Plex Mono'; font-weight:700; color:var(--teal); font-size:12.5px; flex:none; }

  .refs{ display:flex; flex-direction:column; gap:12px; }
  .ref{ font-size:14px; padding-left:26px; text-indent:-26px; }
  .ref .yr{ color:var(--teal-deep); font-weight:600; }

  footer.pagefoot{
    max-width:1040px; margin:8px auto 0; padding:18px; color:var(--ink-soft); font-size:12px;
    border-top:1px solid var(--line);
  }

  @media (max-width:560px){
    h2.page-title{ font-size:21px; }
    .kv{ grid-template-columns:1fr; }
    .kv dt{ padding-top:6px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="mark">รพ</div>
      <div>
        <h1>SAP พังงา</h1>
        <div class="sub">แนวทางยาปฏิชีวนะป้องกันการติดเชื้อผ่าตัด · คณะกรรมการ AMR 2569</div>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="หมวดเนื้อหา"></nav>
</div>

<main id="main"></main>

<footer class="pagefoot">
  โรงพยาบาลพังงา · จัดทำโดยคณะกรรมการป้องกันและควบคุมการดื้อยาต้านจุลชีพ (AMR) · ทบทวนภายใน 3 ปี หรือเมื่อมีหลักฐานใหม่
</footer>

  function renderProcList(container, query){
    container.innerHTML = "";
    var q = (query||"").trim().toLowerCase();
    var matches = PROCEDURES.filter(function(p){
      if(!q) return true;
      return (p.name+" "+p.group+" "+p.drug).toLowerCase().indexOf(q) !== -1;
    });
    var countEl = document.getElementById("proc-count");
    if(countEl) countEl.textContent = q ? ("พบ " + matches.length + " รายการ") : (PROCEDURES.length + " หัตถการทั้งหมด");

    if(matches.length === 0){
      container.appendChild(el("p","lede","ไม่พบหัตถการที่ตรงกับคำค้นหา ลองใช้คำอื่น เช่น “ลำไส้” หรือ “หัวใจ”"));
      return;
    }

    var lastGroup = null;
    matches.forEach(function(p, idx){
      if(p.group !== lastGroup && !q){
        var gh = el("div","cite");
        gh.style.cssText = "margin:16px 0 6px; font-weight:700; color:var(--teal-deep); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase;";
        gh.textContent = p.group;
        container.appendChild(gh);
        lastGroup = p.group;
      }
      var d = document.createElement("details");
      d.className = "proc";
      if(q) d.open = true;
      d.innerHTML =
        '<summary><span class="name">'+esc(p.name)+'</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></summary>' +
        '<div class="body"><dl class="kv">' +
          '<dt>ยาแนะนำ</dt><dd><strong>'+esc(p.drug)+'</strong></dd>' +
          '<dt>ยาทางเลือก</dt><dd>'+esc(p.alt)+'</dd>' +
          '<dt>ให้ซ้ำทุก</dt><dd><span class="tag mono">'+esc(p.redose)+'</span></dd>' +
        '</dl></div>';
      container.appendChild(d);
    });
  }

    panes[t.id] = pane;
    main.appendChild(pane);
  });

  var tabsNav = document.getElementById("tabs");
  var buttons = {};
  TABS.forEach(function(t){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t.label;
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected","false");
    b.addEventListener("click", function(){ activate(t.id); });
    tabsNav.appendChild(b);
    buttons[t.id] = b;
  });

  function activate(id){
    TABS.forEach(function(t){
      var isActive = t.id === id;
      panes[t.id].classList.toggle("active", isActive);
      buttons[t.id].setAttribute("aria-selected", isActive ? "true" : "false");
    });
    try{ localStorage.setItem("sap-pn-tab", id); }catch(e){}
  }

  var initial = "overview";
  try{
    var hash = (location.hash || "").replace("#","");
    var saved = localStorage.getItem("sap-pn-tab");
    if(hash && builders[hash]) initial = hash;
    else if(saved && builders[saved]) initial = saved;
  }catch(e){}
  activate(initial);

})();
</script>
</body>
</html>
